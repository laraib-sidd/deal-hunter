services:
  web:
    image: ${DEAL_HUNTER_IMAGE:-ghcr.io/laraib-sidd/deal-hunter}:${DEAL_HUNTER_IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    volumes:
      - deal-hunter-data:/data
    command:
      - python
      - -m
      - deal_hunter.serve
      - dash
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    entrypoint: []
    ports:
      - 127.0.0.1:8001:8001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/health").read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  run:
    image: ${DEAL_HUNTER_IMAGE:-ghcr.io/laraib-sidd/deal-hunter}:${DEAL_HUNTER_IMAGE_TAG}
    restart: "no"
    env_file: .env
    volumes:
      - deal-hunter-data:/data
    command:
      - deal-hunter
      - run
      - --ai
      - --min-score
      - "6"
      - --notify

volumes:
  deal-hunter-data:
